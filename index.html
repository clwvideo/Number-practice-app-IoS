<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Say the Number">
<title>Say the Number</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF5A5F'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial,Helvetica,sans-serif' font-weight='900' fill='white' text-anchor='middle'%3E123%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 90px 20px 150px;
    box-sizing: border-box;
    transition: background-color 0.25s ease;
  }
  #number {
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.02em;
    text-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.25);
    transform: scale(1);
    transition: transform 0.12s ease;
    line-height: 1;
    white-space: nowrap;
    text-align: center;
  }
  #number.pulse {
    transform: scale(1.08);
  }
  #hint {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 12px) + 70px);
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    z-index: 20;
  }
  #gear {
    position: fixed;
    top: calc(env(safe-area-inset-top, 12px) + 14px);
    right: calc(env(safe-area-inset-right, 12px) + 14px);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    z-index: 20;
    backdrop-filter: blur(4px);
  }
  #toolbar {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 12px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    z-index: 20;
  }
  .roundBtn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(4px);
    flex-shrink: 0;
  }
  #correctBtn { background: #06D6A0; }
  #incorrectBtn { background: #EF476F; }
  #finishBtn {
    height: 54px;
    padding: 0 22px;
    border-radius: 27px;
    background: rgba(255,255,255,0.92);
    color: #1c1c1e;
    font-size: 17px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 24px;
  }
  .overlay.open { display: flex; }
  .panel {
    background: #1c1c1e;
    border-radius: 24px;
    padding: 28px 24px 24px;
    width: 100%;
    max-width: 340px;
    max-height: 80vh;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .panel h2 {
    color: #fff;
    font-size: 20px;
    margin: 0 0 4px;
  }
  .panel p {
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    margin: 0 0 20px;
  }
  #digitGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .digitBtn {
    aspect-ratio: 1;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .digitBtn.selected {
    background: #FF5A5F;
    border-color: #fff;
  }
  .pillBtn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    background: #FF5A5F;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  #statChips {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
  }
  .statChip {
    flex: 1;
    border-radius: 16px;
    padding: 14px 8px;
    color: #fff;
  }
  .statChip.correctChip { background: rgba(6,214,160,0.18); }
  .statChip.incorrectChip { background: rgba(239,71,111,0.18); }
  .statChip .statNum {
    display: block;
    font-size: 32px;
    font-weight: 900;
    line-height: 1.1;
  }
  .statChip .statLabel {
    display: block;
    font-size: 13px;
    font-weight: 600;
    opacity: 0.8;
  }
  #summaryList {
    text-align: left;
  }
  #summaryList .summarySubhead {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  #summaryList ul {
    list-style: none;
    margin: 0 0 20px;
    padding: 0;
  }
  #summaryList li {
    background: rgba(239,71,111,0.15);
    color: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 16px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="number">123</div>
  </div>
  <div id="hint">Mark &#10003; or &#10007; after each number</div>
  <div id="gear">⚙️</div>

  <div id="toolbar">
    <div id="correctBtn" class="roundBtn">✓</div>
    <div id="incorrectBtn" class="roundBtn">✗</div>
    <div id="finishBtn">Finish</div>
    <div id="speakBtn" class="roundBtn">❓</div>
  </div>

  <div id="settingsOverlay" class="overlay">
    <div class="panel">
      <h2>Max Digits</h2>
      <p>Numbers will have up to this many digits</p>
      <div id="digitGrid"></div>
      <div id="doneBtn" class="pillBtn">Done</div>
    </div>
  </div>

  <div id="summaryOverlay" class="overlay">
    <div class="panel">
      <h2>Session Summary</h2>
      <div id="statChips">
        <div class="statChip correctChip">
          <span class="statNum" id="correctCountEl">0</span>
          <span class="statLabel">Correct</span>
        </div>
        <div class="statChip incorrectChip">
          <span class="statNum" id="incorrectCountEl">0</span>
          <span class="statLabel">Incorrect</span>
        </div>
      </div>
      <div id="summaryList"></div>
      <div id="restartBtn" class="pillBtn">Start New Session</div>
    </div>
  </div>

<script>
  const COLORS = ['#FF5A5F', '#3A86FF', '#06D6A0', '#FFB703', '#8338EC', '#FB5607', '#118AB2', '#EF476F'];
  const STORAGE_KEY = 'sayTheNumber.maxDigits';

  const stage = document.getElementById('stage');
  const numberEl = document.getElementById('number');
  const gear = document.getElementById('gear');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const digitGrid = document.getElementById('digitGrid');
  const doneBtn = document.getElementById('doneBtn');
  const speakBtn = document.getElementById('speakBtn');
  const correctBtn = document.getElementById('correctBtn');
  const incorrectBtn = document.getElementById('incorrectBtn');
  const finishBtn = document.getElementById('finishBtn');
  const summaryOverlay = document.getElementById('summaryOverlay');
  const correctCountEl = document.getElementById('correctCountEl');
  const incorrectCountEl = document.getElementById('incorrectCountEl');
  const summaryList = document.getElementById('summaryList');
  const restartBtn = document.getElementById('restartBtn');

  let maxDigits = parseInt(localStorage.getItem(STORAGE_KEY), 10);
  if (!maxDigits || maxDigits < 1 || maxDigits > 7) maxDigits = 3;
  let currentNumber = 0;
  let correctCount = 0;
  let incorrectCount = 0;
  let incorrectNumbers = [];

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateNumber() {
    const digitCount = randomInt(1, maxDigits);
    const min = digitCount === 1 ? 0 : Math.pow(10, digitCount - 1);
    const max = Math.pow(10, digitCount) - 1;
    return randomInt(min, max);
  }

  function fitNumberText() {
    const maxWidth = window.innerWidth - 48;
    const maxHeight = window.innerHeight - 260;
    let fontSize = Math.min(window.innerWidth, window.innerHeight) * 0.6;
    numberEl.style.fontSize = fontSize + 'px';
    while (fontSize > 12 && (numberEl.scrollWidth > maxWidth || numberEl.scrollHeight > maxHeight)) {
      fontSize -= 2;
      numberEl.style.fontSize = fontSize + 'px';
    }
  }

  function showNewNumber() {
    currentNumber = generateNumber();
    numberEl.textContent = currentNumber.toLocaleString('en-US');
    fitNumberText();
    stage.style.backgroundColor = COLORS[randomInt(0, COLORS.length - 1)];
    numberEl.classList.remove('pulse');
    void numberEl.offsetWidth;
    numberEl.classList.add('pulse');
  }

  function speakNumber() {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(String(currentNumber));
    window.speechSynthesis.speak(utterance);
  }

  window.addEventListener('resize', fitNumberText);

  function buildDigitGrid() {
    digitGrid.innerHTML = '';
    for (let i = 1; i <= 7; i++) {
      const btn = document.createElement('div');
      btn.className = 'digitBtn' + (i === maxDigits ? ' selected' : '');
      btn.textContent = i;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        maxDigits = i;
        localStorage.setItem(STORAGE_KEY, String(maxDigits));
        buildDigitGrid();
      });
      digitGrid.appendChild(btn);
    }
  }

  function showSummary() {
    correctCountEl.textContent = correctCount;
    incorrectCountEl.textContent = incorrectCount;
    if (incorrectNumbers.length) {
      summaryList.innerHTML = '<p class="summarySubhead">Numbers read incorrectly:</p><ul>' +
        incorrectNumbers.map(n => '<li>' + n + '</li>').join('') + '</ul>';
    } else if (correctCount + incorrectCount > 0) {
      summaryList.innerHTML = '<p class="summarySubhead">All numbers were read correctly! 🎉</p>';
    } else {
      summaryList.innerHTML = '';
    }
    summaryOverlay.classList.add('open');
  }

  function resetSession() {
    correctCount = 0;
    incorrectCount = 0;
    incorrectNumbers = [];
    showNewNumber();
  }

  stage.addEventListener('click', showNewNumber);

  gear.addEventListener('click', (e) => {
    e.stopPropagation();
    buildDigitGrid();
    settingsOverlay.classList.add('open');
  });

  doneBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsOverlay.classList.remove('open');
  });

  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) settingsOverlay.classList.remove('open');
  });

  speakBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    speakNumber();
  });

  correctBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    correctCount++;
    showNewNumber();
  });

  incorrectBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    incorrectCount++;
    incorrectNumbers.push(currentNumber.toLocaleString('en-US'));
    showNewNumber();
  });

  finishBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    showSummary();
  });

  restartBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    summaryOverlay.classList.remove('open');
    resetSession();
  });

  summaryOverlay.addEventListener('click', (e) => {
    if (e.target === summaryOverlay) summaryOverlay.classList.remove('open');
  });

  showNewNumber();
</script>
</body>
</html>
